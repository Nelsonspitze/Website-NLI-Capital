  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"67ae873a-25cf-48fa-a0ae-c3ffc6d368b2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c5e95d49-c5da-433e-86d2-1e751b33004f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"40a865d8-5255-4561-8a4f-06cfbafd8d46\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1d3ce952-3425-4777-b8b0-3e3cec6440f4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"4acd61d8-5aa3-4fd4-8070-6c63441e58cb\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lato';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"505ac234-f7e1-4530-a9ae-8ee166f33263\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #ffffff; }\n  body { font-family: Calibri, Lato, \"Segoe UI\", sans-serif; color: #2D3748; -webkit-font-smoothing: antialiased; }\n  a { color: #007B78; text-decoration: none; }\n  a:hover { color: #E53E3E; }\n  * { box-sizing: border-box; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100%; background:#ffffff;\">\n\n  <header style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; padding:22px 48px; border-bottom:1px solid #E2E8F0; position:sticky; top:0; background:rgba(255,255,255,0.94); backdrop-filter:blur(8px); z-index:20;\">\n    <img src=\"441fd671-5b2e-47f9-ab76-08c8e28d4bd6\" alt=\"NLI Capital\" style=\"height:26px; width:auto; display:block;\">\n    <div style=\"display:flex; align-items:center; gap:28px;\">\n      <a href=\"#criteria\" style=\"font-size:14px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#4A5568;\">Criteria<\u002Fa>\n      <a href=\"#inbreng\" style=\"font-size:14px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#4A5568;\">Wat wij inbrengen<\u002Fa>\n      <a href=\"#aanmelden\" style=\"display:inline-block; padding:10px 20px; background:#007B78; color:#ffffff; font-size:14px; font-weight:700; letter-spacing:0.03em; border-radius:2px;\" style-hover=\"background:#005F5D; color:#ffffff;\">Bedrijf melden<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"padding:84px 48px 72px; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:64px; align-items:start; max-width:1360px; margin:0 auto;\">\n    <div>\n      <div style=\"display:inline-block; padding:6px 12px; background:#F7FAFC; border-left:3px solid #E53E3E; font-size:13px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#007B78; margin-bottom:26px;\">Zoekprofiel voor intermediairs<\u002Fdiv>\n      <h1 style=\"margin:0 0 22px; font-size:56px; line-height:1.06; font-weight:900; letter-spacing:-0.02em; color:#1A2733; text-wrap:balance;\">Platform installatie- en klimaattechniek<\u002Fh1>\n      <p style=\"margin:0 0 30px; font-size:21px; line-height:1.5; color:#4A5568; max-width:34em; text-wrap:pretty;\">Onze investeringsthesis, ons zoekprofiel en waar wij scherp op letten. Ken jij een installatiebedrijf met een stevige servicebasis, dan is één naam genoeg — wij toetsen binnen een week.<\u002Fp>\n      <div style=\"display:flex; flex-wrap:wrap; gap:14px;\">\n        <a href=\"#aanmelden\" style=\"display:inline-block; padding:15px 28px; background:#E53E3E; color:#ffffff; font-size:16px; font-weight:700; border-radius:2px;\" style-hover=\"background:#C62B2B; color:#ffffff;\">Meld een bedrijf aan<\u002Fa>\n        <a href=\"#criteria\" style=\"display:inline-block; padding:15px 28px; border:1px solid #CBD5E0; color:#2D3748; font-size:16px; font-weight:700; border-radius:2px;\" style-hover=\"border-color:#007B78; color:#007B78;\">Toets tegen de criteria<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#F7FAFC; padding:34px 32px; border-top:4px solid #007B78;\">\n      <div style=\"font-size:13px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#007B78; margin-bottom:24px;\">In één oogopslag<\u002Fdiv>\n      <div style=\"display:grid; gap:20px;\">\n        <div style=\"display:grid; gap:4px;\">\n          <div style=\"font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#718096;\">Omzet<\u002Fdiv>\n          <div style=\"font-size:22px; font-weight:700; color:#1A2733;\">EUR 5 – 20 miljoen<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; gap:4px;\">\n          <div style=\"font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#718096;\">EBITDA<\u002Fdiv>\n          <div style=\"font-size:22px; font-weight:700; color:#1A2733;\">EUR 0,5 – 2,0 miljoen<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; gap:4px;\">\n          <div style=\"font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#718096;\">Regio<\u002Fdiv>\n          <div style=\"font-size:22px; font-weight:700; color:#1A2733;\">Heel Nederland<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; gap:4px;\">\n          <div style=\"font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#718096;\">Fondsomvang<\u002Fdiv>\n          <div style=\"font-size:22px; font-weight:700; color:#1A2733;\">{{ fundLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#1A2733; padding:76px 48px;\">\n    <div style=\"max-width:1360px; margin:0 auto;\">\n      <div style=\"font-size:13px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#4FD1CA; margin-bottom:14px;\">Waarom deze markt, waarom nu<\u002Fdiv>\n      <h2 style=\"margin:0 0 12px; font-size:38px; line-height:1.15; font-weight:900; letter-spacing:-0.015em; color:#ffffff; max-width:22em;\">Wetgeving zet de vraag vast, schaarste bepaalt wie hem kan leveren<\u002Fh2>\n      <p style=\"margin:0 0 48px; font-size:18px; line-height:1.6; color:#A9B6C4; max-width:44em; text-wrap:pretty;\">Drie regelingen op rij maken verduurzaming van de gebouwde omgeving geen keuze meer maar een verplichting. De orderboeken zijn daarmee voor jaren gevuld.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:1px; background:#2E3E4D; margin-bottom:48px;\">\n        <div style=\"background:#1A2733; padding:30px 28px 32px;\">\n          <div style=\"font-size:44px; font-weight:900; color:#4FD1CA; letter-spacing:-0.02em; line-height:1;\">2027<\u002Fdiv>\n          <div style=\"width:32px; height:3px; background:#E53E3E; margin:16px 0;\"><\u002Fdiv>\n          <div style=\"font-size:17px; line-height:1.45; color:#DCE4EB; font-weight:400;\">Einde salderingsregeling zonnepanelen — thuisbatterijen en warmtepompen worden de logische vervolgstap.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#1A2733; padding:30px 28px 32px;\">\n          <div style=\"font-size:44px; font-weight:900; color:#4FD1CA; letter-spacing:-0.02em; line-height:1;\">2028<\u002Fdiv>\n          <div style=\"width:32px; height:3px; background:#E53E3E; margin:16px 0;\"><\u002Fdiv>\n          <div style=\"font-size:17px; line-height:1.45; color:#DCE4EB; font-weight:400;\">Start ETS2: CO<sub>2<\u002Fsub>-beprijzing op gas in de gebouwde omgeving. Stoken wordt structureel duurder.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#1A2733; padding:30px 28px 32px;\">\n          <div style=\"font-size:44px; font-weight:900; color:#4FD1CA; letter-spacing:-0.02em; line-height:1;\">2029<\u002Fdiv>\n          <div style=\"width:32px; height:3px; background:#E53E3E; margin:16px 0;\"><\u002Fdiv>\n          <div style=\"font-size:17px; line-height:1.45; color:#DCE4EB; font-weight:400;\">Hybridenormering bij vervanging van de gasketel — elke ketelbeurt wordt een verduurzamingsopdracht.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:40px; padding-top:40px; border-top:1px solid #2E3E4D;\">\n        <div>\n          <h3 style=\"margin:0 0 12px; font-size:22px; font-weight:700; color:#ffffff;\">Schaarste aan de aanbodkant<\u002Fh3>\n          <p style=\"margin:0; font-size:17px; line-height:1.6; color:#A9B6C4; text-wrap:pretty;\">Er is een structureel tekort aan installatievakmensen. Schaal wint de strijd om personeel: opleidingsbudget, doorgroeipad en een fatsoenlijke bus zijn geen bijzaak meer maar het verschil tussen wel en niet kunnen leveren.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 12px; font-size:22px; font-weight:700; color:#ffffff;\">Een sterk gefragmenteerde markt<\u002Fh3>\n          <p style=\"margin:0; font-size:17px; line-height:1.6; color:#A9B6C4; text-wrap:pretty;\">Regeldruk, certificering, inkoopkracht, een strak georganiseerde backoffice en modern werkgeverschap zijn voor een bedrijf met een handvol monteurs niet meer alleen te dragen. Die ondernemers zoeken aansluiting bij een grotere partij.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:76px 48px; max-width:1360px; margin:0 auto;\">\n    <div style=\"font-size:13px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#007B78; margin-bottom:14px;\">De thesis in vier stappen<\u002Fdiv>\n    <h2 style=\"margin:0 0 42px; font-size:38px; line-height:1.15; font-weight:900; letter-spacing:-0.015em; color:#1A2733; max-width:20em;\">Van markt naar platform naar waarde<\u002Fh2>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:28px;\">\n      <div>\n        <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:14px; padding-bottom:12px; border-bottom:2px solid #007B78;\">\n          <span style=\"font-size:15px; font-weight:900; color:#007B78;\">1<\u002Fspan>\n          <span style=\"font-size:15px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#1A2733;\">Markt<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:17px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Een tienjarige verduurzamingsgolf in een gefragmenteerde markt. Volumegroei en consolidatiedruk komen tegelijk op — regelgeving duwt de kleinste partijen naar een grotere partner.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:14px; padding-bottom:12px; border-bottom:2px solid #007B78;\">\n          <span style=\"font-size:15px; font-weight:900; color:#007B78;\">2<\u002Fspan>\n          <span style=\"font-size:15px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#1A2733;\">Platform<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:17px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Een regionaal bedrijf met een servicebasis en een werkende backoffice is het fundament. Terugkerend onderhoud geeft voorspelbare kasstroom en is tegelijk het kanaal waarlangs verduurzamingsprojecten binnenkomen.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:14px; padding-bottom:12px; border-bottom:2px solid #007B78;\">\n          <span style=\"font-size:15px; font-weight:900; color:#007B78;\">3<\u002Fspan>\n          <span style=\"font-size:15px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#1A2733;\">Buy-and-build<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:17px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Lokale bedrijven aanhaken met behoud van naam en klantrelatie. Een servicekantoor centraliseert inkoop, planning, HR, finance en ERP. Oud-eigenaren krijgen een rol in de groep.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:14px; padding-bottom:12px; border-bottom:2px solid #E53E3E;\">\n          <span style=\"font-size:15px; font-weight:900; color:#E53E3E;\">4<\u002Fspan>\n          <span style=\"font-size:15px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#1A2733;\">Waarde<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:17px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Schaalvoordeel in inkoop en overhead, hogere productiviteit per monteur via centrale planning, en een platform dat voor een koper meer waard is dan de som van de losse bedrijven.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"criteria\" style=\"padding:0 48px 76px; max-width:1360px; margin:0 auto;\">\n    <div style=\"display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:24px; margin-bottom:36px;\">\n      <div>\n        <div style=\"font-size:13px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#007B78; margin-bottom:14px;\">Wat wij zoeken<\u002Fdiv>\n        <h2 style=\"margin:0; font-size:38px; line-height:1.15; font-weight:900; letter-spacing:-0.015em; color:#1A2733; max-width:20em;\">Acht criteria — vink aan wat je herkent<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"background:#F7FAFC; border-left:4px solid {{ scoreColor }}; padding:16px 22px; min-width:270px;\">\n        <div style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#718096; margin-bottom:6px;\">Passendheid<\u002Fdiv>\n        <div style=\"font-size:26px; font-weight:900; color:#1A2733; line-height:1.1;\">{{ scoreLabel }}<\u002Fdiv>\n        <div style=\"font-size:15px; color:#4A5568; margin-top:4px;\">{{ scoreAdvice }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:14px;\">\n      <sc-for list=\"{{ criteria }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <div sc-camel-on-click=\"{{ c.toggle }}\" style=\"cursor:pointer; display:grid; grid-template-columns:26px minmax(0,1fr); gap:16px; align-items:start; padding:22px 24px; border:1px solid {{ c.borderColor }}; background:{{ c.bg }}; transition:border-color .15s, background .15s;\" style-hover=\"border-color:#007B78;\">\n          <div style=\"width:26px; height:26px; border:2px solid {{ c.markColor }}; background:{{ c.markFill }}; display:flex; align-items:center; justify-content:center; margin-top:2px;\">\n            <span style=\"color:#ffffff; font-size:15px; font-weight:900; line-height:1;\">{{ c.mark }}<\u002Fspan>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#007B78; margin-bottom:6px;\">{{ c.label }}<\u002Fdiv>\n            <div style=\"font-size:17px; line-height:1.45; color:#2D3748; text-wrap:pretty;\">{{ c.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:20px; display:flex; flex-wrap:wrap; align-items:center; gap:18px;\">\n      <button sc-camel-on-click=\"{{ reset }}\" style=\"padding:10px 18px; background:#ffffff; border:1px solid #CBD5E0; color:#4A5568; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; border-radius:2px;\" style-hover=\"border-color:#007B78; color:#007B78;\">Selectie wissen<\u002Fbutton>\n      <span style=\"font-size:15px; color:#718096;\">Niet alles hoeft te kloppen. Twijfel je, meld het bedrijf dan alsnog.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:0 48px 76px; max-width:1360px; margin:0 auto;\">\n    <div style=\"border:1px solid #FBD5D5; background:#FFF7F7; padding:28px 32px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:22px; align-items:center;\">\n      <div style=\"width:40px; height:40px; background:#E53E3E; color:#ffffff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:900; line-height:1;\">×<\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#C62B2B; margin-bottom:6px;\">Wat wij niet zoeken<\u002Fdiv>\n        <div style=\"font-size:19px; line-height:1.5; color:#2D3748;\">Pure projectbedrijven zonder servicebasis. Volledige exits waarbij kennis en klantrelaties het bedrijf verlaten. Start-ups en turnarounds.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:20px 0 0; font-size:17px; line-height:1.55; color:#718096; max-width:44em;\">Een eerste gesprek is vrijblijvend en vertrouwelijk. Wij delen onze marktanalyse ook als het niet tot een transactie komt.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"padding:0 48px 76px; max-width:1360px; margin:0 auto;\">\n    <div style=\"font-size:13px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#007B78; margin-bottom:14px;\">Waar wij scherp op letten<\u002Fdiv>\n    <h2 style=\"margin:0 0 12px; font-size:38px; line-height:1.15; font-weight:900; letter-spacing:-0.015em; color:#1A2733; max-width:22em;\">Zes dingen die wij als eerste willen zien — en waarom<\u002Fh2>\n    <p style=\"margin:0 0 40px; font-size:18px; line-height:1.6; color:#4A5568; max-width:44em; text-wrap:pretty;\">Handig om te weten voordat je een bedrijf voordraagt: hier hangt de waardering aan, niet aan de omzet.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(340px,1fr)); gap:1px; background:#E2E8F0; border:1px solid #E2E8F0;\">\n      <div style=\"background:#ffffff; padding:28px 28px;\">\n        <h3 style=\"margin:0 0 8px; font-size:19px; font-weight:700; color:#1A2733;\">Kwaliteit van de terugkerende omzet<\u002Fh3>\n        <p style=\"margin:0; font-size:16px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Wij scheiden echt terugkerend onderhoud van cyclisch projectwerk. Dat onderscheid bepaalt de waardering meer dan de omzet zelf.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff; padding:28px 28px;\">\n        <h3 style=\"margin:0 0 8px; font-size:19px; font-weight:700; color:#1A2733;\">Omzet en marge per monteur<\u002Fh3>\n        <p style=\"margin:0; font-size:16px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">De monteur is de schaarse factor. Productiviteit per FTE zegt meer over de kwaliteit van de organisatie dan de omzetgroei.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff; padding:28px 28px;\">\n        <h3 style=\"margin:0 0 8px; font-size:19px; font-weight:700; color:#1A2733;\">Betrouwbaarheid van de administratie<\u002Fh3>\n        <p style=\"margin:0; font-size:16px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Kloppen de cijfers en draagt het ERP de organisatie? Zonder betrouwbare basis kan een platform niet integreren of overnemen.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff; padding:28px 28px;\">\n        <h3 style=\"margin:0 0 8px; font-size:19px; font-weight:700; color:#1A2733;\">Diepte van het managementteam<\u002Fh3>\n        <p style=\"margin:0; font-size:16px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Wat gebeurt er als de ondernemer een maand wegvalt? Een tweede laag in het MT is een voorwaarde voor buy-and-build.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff; padding:28px 28px;\">\n        <h3 style=\"margin:0 0 8px; font-size:19px; font-weight:700; color:#1A2733;\">Bewezen integratievermogen<\u002Fh3>\n        <p style=\"margin:0; font-size:16px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Heeft de ondernemer eerder een bedrijf overgenomen en geïntegreerd, met behoud van personeel en klanten?<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff; padding:28px 28px;\">\n        <h3 style=\"margin:0 0 8px; font-size:19px; font-weight:700; color:#1A2733;\">Balans en werkkapitaal<\u002Fh3>\n        <p style=\"margin:0; font-size:16px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Voorraad, debiteuren en onderhanden werk. Veel installatiebedrijven groeien zich vast op werkkapitaal.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"inbreng\" style=\"background:#F7FAFC; padding:76px 48px;\">\n    <div style=\"max-width:1360px; margin:0 auto;\">\n      <div style=\"font-size:13px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#007B78; margin-bottom:14px;\">Wat wij inbrengen<\u002Fdiv>\n      <h2 style=\"margin:0 0 42px; font-size:38px; line-height:1.15; font-weight:900; letter-spacing:-0.015em; color:#1A2733; max-width:22em;\">Kapitaal is het begin, de uitvoering is het verschil<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:1px; background:#DDE4EB;\">\n        <div style=\"background:#ffffff; padding:30px 28px;\">\n          <div style=\"font-size:34px; font-weight:900; color:#DDE4EB; line-height:1; margin-bottom:14px;\">01<\u002Fdiv>\n          <h3 style=\"margin:0 0 8px; font-size:19px; font-weight:700; color:#1A2733;\">Eigen vermogen én vervolgkapitaal<\u002Fh3>\n          <p style=\"margin:0; font-size:16px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Uit {{ fundLabelLong }}, met ruimte gereserveerd voor de add-ons die daarna volgen.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff; padding:30px 28px;\">\n          <div style=\"font-size:34px; font-weight:900; color:#DDE4EB; line-height:1; margin-bottom:14px;\">02<\u002Fdiv>\n          <h3 style=\"margin:0 0 8px; font-size:19px; font-weight:700; color:#1A2733;\">Buy-and-build als kern<\u002Fh3>\n          <p style=\"margin:0; font-size:16px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Wij doen dealflow, waardering, financiering en integratie. De ondernemer blijft aan het roer.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff; padding:30px 28px;\">\n          <div style=\"font-size:34px; font-weight:900; color:#DDE4EB; line-height:1; margin-bottom:14px;\">03<\u002Fdiv>\n          <h3 style=\"margin:0 0 8px; font-size:19px; font-weight:700; color:#1A2733;\">Balans op orde aan de voorkant<\u002Fh3>\n          <p style=\"margin:0; font-size:16px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Herfinanciering en sanering eerst, zodat er weer investeringsruimte ontstaat.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff; padding:30px 28px;\">\n          <div style=\"font-size:34px; font-weight:900; color:#DDE4EB; line-height:1; margin-bottom:14px;\">04<\u002Fdiv>\n          <h3 style=\"margin:0 0 8px; font-size:19px; font-weight:700; color:#1A2733;\">Een echt servicekantoor<\u002Fh3>\n          <p style=\"margin:0; font-size:16px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Inkoop, planning, HR, finance en ERP centraal — met behoud van de lokale naam.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"aanmelden\" style=\"padding:76px 48px 88px; max-width:1360px; margin:0 auto;\">\n    <div style=\"font-size:13px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#007B78; margin-bottom:14px;\">Wat wij van jou vragen<\u002Fdiv>\n    <h2 style=\"margin:0 0 42px; font-size:38px; line-height:1.15; font-weight:900; letter-spacing:-0.015em; color:#1A2733; max-width:20em;\">Een naam is genoeg om te beginnen<\u002Fh2>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:32px; margin-bottom:52px;\">\n      <div style=\"border-top:4px solid #007B78; padding-top:22px;\">\n        <h3 style=\"margin:0 0 10px; font-size:21px; font-weight:700; color:#1A2733;\">Eén naam, vier gegevens<\u002Fh3>\n        <p style=\"margin:0; font-size:17px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Bedrijf, regio, indicatie van omvang en wat er speelt. Wij toetsen binnen een week en koppelen terug.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:4px solid #007B78; padding-top:22px;\">\n        <h3 style=\"margin:0 0 10px; font-size:21px; font-weight:700; color:#1A2733;\">Jij houdt de regie<\u002Fh3>\n        <p style=\"margin:0; font-size:17px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Wij nemen pas contact op zoals jij dat wilt: met jou erbij, of volledig via jou.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:4px solid #E53E3E; padding-top:22px;\">\n        <h3 style=\"margin:0 0 10px; font-size:21px; font-weight:700; color:#1A2733;\">Succesfee bij closing<\u002Fh3>\n        <p style=\"margin:0; font-size:17px; line-height:1.55; color:#4A5568; text-wrap:pretty;\">Komt de transactie voort uit jouw introductie, dan staat daar een succesfee tegenover: {{ succesfee }}.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#007B78; padding:44px 44px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:36px; align-items:center;\">\n      <div>\n        <div style=\"font-size:30px; font-weight:900; color:#ffffff; line-height:1.2; margin-bottom:8px; text-wrap:balance;\">Ken je een installatiebedrijf dat hierop lijkt?<\u002Fdiv>\n        <div style=\"font-size:18px; color:#BEE8E6; line-height:1.5;\">Stuur ons de naam. Geen dossier, geen dataroom — wij doen de rest.<\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"mailto:{{ contactEmail }}?subject=Zoekprofiel%20installatietechniek\" style=\"display:inline-block; white-space:nowrap; padding:17px 32px; background:#ffffff; color:#007B78; font-size:17px; font-weight:700; border-radius:2px;\" style-hover=\"background:#E53E3E; color:#ffffff;\">{{ contactEmail }}<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid #E2E8F0; padding:30px 48px 46px;\">\n    <div style=\"max-width:1360px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:20px;\">\n      <img src=\"441fd671-5b2e-47f9-ab76-08c8e28d4bd6\" alt=\"NLI Capital\" style=\"height:22px; width:auto; display:block;\">\n      <div style=\"font-size:14px; color:#A0AEC0;\">Zoekprofiel installatie- en klimaattechniek · augustus 2026 · vertrouwelijk, uitsluitend voor intermediairs<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;succesfee&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2%&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Inhoud&quot;},&quot;contactEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;dealflow@nlicapital.nl&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Inhoud&quot;},&quot;fundSize&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;EUR 50 miljoen&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Inhoud&quot;}}\">\nconst CRITERIA = [\n  { label: \"Sector\", text: \"Installatie- en klimaattechniek: verwarming, koeling, ventilatie, verduurzaming.\" },\n  { label: \"Omzet\", text: \"EUR 5 tot 20 miljoen.\" },\n  { label: \"EBITDA\", text: \"EUR 0,5 tot 2,0 miljoen, marge vanaf circa 6%.\" },\n  { label: \"Omzetmix\", text: \"Substantiële service- en onderhoudsbasis naast het projectwerk.\" },\n  { label: \"Regio\", text: \"Heel Nederland, met voorkeur voor regionale dichtheid om op verder te bouwen.\" },\n  { label: \"Ondernemer\", text: \"DGA of MT blijft aan en rolt mee. Geen volledige cash-out.\" },\n  { label: \"Belang\", text: \"Meerderheid, of een substantiële minderheid met zeggenschap.\" },\n  { label: \"Aanleiding\", text: \"Balansvraag, opvolging, of groeiambitie die eigen middelen overstijgt.\" }\n];\n\nclass Component extends DCLogic {\n  state = { checked: [] };\n\n  toggle(i) {\n    this.setState(s => ({\n      checked: s.checked.includes(i) ? s.checked.filter(x => x !== i) : s.checked.concat(i)\n    }));\n  }\n\n  renderVals() {\n    const checked = this.state.checked;\n    const n = checked.length;\n    const criteria = CRITERIA.map((c, i) => {\n      const on = checked.includes(i);\n      return {\n        label: c.label,\n        text: c.text,\n        mark: on ? \"\\u2713\" : \"\",\n        markColor: on ? \"#007B78\" : \"#CBD5E0\",\n        markFill: on ? \"#007B78\" : \"#ffffff\",\n        borderColor: on ? \"#007B78\" : \"#E2E8F0\",\n        bg: on ? \"#F2FAFA\" : \"#ffffff\",\n        toggle: () => this.toggle(i)\n      };\n    });\n\n    let scoreLabel, scoreAdvice, scoreColor;\n    if (n === 0) { scoreLabel = \"Nog niets aangevinkt\"; scoreAdvice = \"Vink de criteria aan die je herkent.\"; scoreColor = \"#CBD5E0\"; }\n    else if (n <= 2) { scoreLabel = n + \" van 8\"; scoreAdvice = \"Mogelijk te vroeg — maar meld het gerust.\"; scoreColor = \"#E53E3E\"; }\n    else if (n <= 5) { scoreLabel = n + \" van 8\"; scoreAdvice = \"Interessant. Wij toetsen graag.\"; scoreColor = \"#319795\"; }\n    else { scoreLabel = n + \" van 8\"; scoreAdvice = \"Sterke match. Meld dit bedrijf vandaag.\"; scoreColor = \"#007B78\"; }\n\n    const fund = this.props.fundSize ?? \"EUR 50 miljoen\";\n    return {\n      criteria, scoreLabel, scoreAdvice, scoreColor,\n      reset: () => this.setState({ checked: [] }),\n      succesfee: this.props.succesfee ?? \"2%\",\n      contactEmail: this.props.contactEmail ?? \"dealflow@nlicapital.nl\",\n      fundLabel: \"NLI Capital Fonds I \\u2014 \" + fund,\n      fundLabelLong: \"NLI Capital Fonds I (\" + fund + \")\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
